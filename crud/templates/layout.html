<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Energy Dashboard" }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    
    <style>
        :root {
            --header-height: 60px;
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            box-sizing: border-box;
            /* Asegúrate de que el color de fondo sea sólido aquí */
        }

        /* CENTRADO PERFECTO DEL TÍTULO */
        .app-header h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 1.25rem;
            white-space: nowrap;
            pointer-events: none; /* Evita que el h1 bloquee clics en botones cercanos si creciera mucho */
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto; /* Empuja los botones a la derecha */
            z-index: 1001;
        }

        .btn-menu {
            z-index: 1001; /* Mantiene el botón de hamburguesa por encima */
        }

        /* ELIMINACIÓN DEL GAP EN LA SIDEBAR */
        .sidebar {
            position: fixed;
            top: var(--header-height); /* Empieza exactamente después del header */
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - var(--header-height));
            z-index: 999;
            margin: 0;
            border-right: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        /* Ajuste para cuando el sidebar está oculto */
        .sidebar-hidden .sidebar {
            transform: translateX(-100%);
        }

        /* Main debe respetar el espacio del sidebar si no está oculto */
        main {
            padding: 10px;
            transition: margin-left 0.3s ease;
        }

        .sidebar-hidden main {
            margin-left: 0;
        }

        /* Botones con estilo profesional */
        .btn-nav {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .btn-refresh svg {
            transition: transform 0.3s ease;
        }

        .btn-refresh:hover svg {
            transform: rotate(180deg);
        }
    </style>

    <script>
        if (window.Chart && window['chartjs-plugin-zoom']) {
            Chart.register(window['chartjs-plugin-zoom']);
        }
    </script>
</head>
<body class="sidebar-hidden">

    <header class="app-header">
        <button class="btn-menu" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
        </button>
        
        <h1>Microgrid Energy Consumption Dashboard</h1>
        
        <div class="header-tools">
            <!-- Time Window Selector -->
            <select id="time-window-select" class="btn-nav" style="background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.2); outline: none; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-family: inherit; font-size: 13px;">
                <option value="all" style="color: black;">All Data</option>
                <option value="5m" style="color: black;">Last 5 mins</option>
                <option value="15m" style="color: black;">Last 15 mins</option>
                <option value="1h" style="color: black;">Last 1 hour</option>
                <option value="24h" style="color: black;">Last 24 hours</option>
            </select>

            <!-- Auto Refresh Selector -->
            <select id="auto-refresh-select" class="btn-nav" style="background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.2); outline: none; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-family: inherit; font-size: 13px;">
                <option value="off" style="color: black;">Refresh: Off</option>
                <option value="10" style="color: black;">Refresh: 10s</option>
                <option value="30" style="color: black;">Refresh: 30s</option>
                <option value="60" style="color: black;">Refresh: 1m</option>
                <option value="300" style="color: black;">Refresh: 5m</option>
            </select>

            <button class="btn-nav btn-refresh" onclick="location.reload()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>Update</span>
            </button>

            <button class="btn-nav btn-theme" onclick="toggleTheme()" title="Cambiar Tema">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>
    
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">Settings</h3>
            <div class="control-group">
                <div class="control-item">
                    <input type="checkbox" id="show-grid" checked>
                    <label for="show-grid">Show grid</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tooltips" checked>
                    <label for="show-tooltips">Show tooltips</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="animate-charts">
                    <label for="animate-charts">Interaction</label>
                </div>
            </div>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Graphics Visibility</h3>
            <div class="control-group charts-visibility">
                <div class="control-item">
                    <input type="checkbox" id="show-todos_nodos" checked>
                    <label for="show-todos_nodos">All</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-potencia" checked>
                    <label for="show-potencia">Power</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tension" checked>
                    <label for="show-tension">Tension</label>
                </div>
                <hr>
                {% for nodo in data_por_nodo.keys() %}
                <div class="control-item">
                    <input type="checkbox" id="show-{{ nodo }}" class="checkbox-nodo" checked>
                    <label for="show-{{ nodo }}">Node {{ nodo }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
    </aside>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="overlay" onclick="toggleSidebar()"></div>

    <script>
        const DATA_POR_NODO = {{ data_por_nodo|tojson }};
        const TOTALES = {{ totales|tojson }};

        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            
            const currentWindow = urlParams.get('window') || 'all';
            const currentRefresh = urlParams.get('refresh') || 'off';
            
            const windowSelect = document.getElementById('time-window-select');
            const refreshSelect = document.getElementById('auto-refresh-select');
            
            if (windowSelect) windowSelect.value = currentWindow;
            if (refreshSelect) refreshSelect.value = currentRefresh;
            
            windowSelect?.addEventListener('change', function () {
                urlParams.set('window', this.value);
                window.location.search = urlParams.toString();
            });
            
            refreshSelect?.addEventListener('change', function () {
                urlParams.set('refresh', this.value);
                window.location.search = urlParams.toString();
            });
            
            if (currentRefresh !== 'off') {
                const intervalMs = parseInt(currentRefresh) * 1000;
                if (!isNaN(intervalMs) && intervalMs > 0) {
                    setTimeout(function () {
                        window.location.reload();
                    }, intervalMs);
                }
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
