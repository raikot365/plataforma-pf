<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Energy Panel" }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">  dejo comentado porque genera conflicto
     con la ruta /statuc de swag-->
    <link rel="stylesheet" href="/crud/static/css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    <script>
        if (window.Chart && window['chartjs-plugin-zoom']) {
            Chart.register(window['chartjs-plugin-zoom']);
        }
    </script>

</head>
<body class="sidebar-hidden">
    <header class="app-header">
        <button class="btn-menu" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
        </button>
        <h1>Energy Monitoring Panel</h1>
        <div class="header-tools">
            <button class="btn-theme" onclick="toggleTheme()">🌙</button>
        </div>
    </header>
    
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">Settings</h3>
            <div class="control-group">
                <div class="control-item">
                    <input type="checkbox" id="show-grid" checked>
                    <label for="show-grid">Show grid</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tooltips" checked>
                    <label for="show-tooltips">Show tooltips</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="animate-charts" checked>
                    <label for="animate-charts">Interaction</label>
                </div>
            </div>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Graphics Visibility</h3>
            <div class="control-group charts-visibility">

                <!-- Globales -->
                <div class="control-item">
                    <input type="checkbox" id="show-todos_nodos" checked>
                    <label for="show-todos_nodos">All</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-potencia" checked>
                    <label for="show-potencia">Power</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tension" checked>
                    <label for="show-tension">Tension</label>
                </div>

                <hr>

                <!-- Nodos individuales -->
                {% for nodo in data_por_nodo.keys() %}
                <div class="control-item">
                    <input type="checkbox" id="show-{{ nodo }}" class="checkbox-nodo" checked>
                    <label for="show-{{ nodo }}">Node {{ nodo }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

    </aside>

    <main>
        <div class="top-bar">
            <!-- <select id="time-range">
                <option value="1h">Última hora</option>
                <option value="24h" selected>Últimas 24 horas</option>
                <option value="7d">Última semana</option>
                <option value="30d">Último mes</option>
            </select> -->
            <button class="btn-refresh">Update data</button>
        </div>
        {% block content %}{% endblock %}
    </main>

    <!-- Overlay para el sidebar en móvil -->
    <div class="overlay" onclick="toggleSidebar()"></div>

    <!-- Script JS principal -->
     <script>
    // Estas dos líneas deben ir en el template Jinja *antes* de cargar main.js
    const DATA_POR_NODO = {{ data_por_nodo|tojson }};
    const TOTALES = {{ totales|tojson }};
    </script>
    <!-- <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script> -->
    <script src="/crud/static/js/main.js"></script>
</body>
</html>
