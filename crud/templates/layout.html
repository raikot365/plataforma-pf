<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Panel Energético" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"> -->
    <link rel="stylesheet" href="/crud/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
</head>
<body>
    <header class="app-header">
        <button class="btn-menu" onclick="toggleSidebar()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
        </button>
        <h1>Panel de Monitoreo de Energía</h1>
        <div class="header-tools">
            <button class="btn-theme" onclick="toggleTheme()">🌙</button>
        </div>
    </header>
    
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">Configuración</h3>
            <div class="control-group">
                <div class="control-item">
                    <input type="checkbox" id="show-grid" checked>
                    <label for="show-grid">Mostrar cuadrícula</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tooltips" checked>
                    <label for="show-tooltips">Mostrar tooltips</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="animate-charts" checked>
                    <label for="animate-charts">Animaciones</label>
                </div>
            </div>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Visibilidad de Gráficos</h3>
            <div class="control-group charts-visibility">
                <div class="control-item">
                    <input type="checkbox" id="show-potencia" checked>
                    <label for="show-potencia">Potencia</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-corriente" checked>
                    <label for="show-corriente">Corriente</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-tension" checked>
                    <label for="show-tension">Tensión</label>
                </div>
                <div class="control-item">
                    <input type="checkbox" id="show-consumo_total" checked>
                    <label for="show-consumo_total">Consumo Total</label>
                </div>
            </div>
        </div>
    </aside>

    <main>
        <div class="top-bar">
            <select id="time-range">
                <option value="1h">Última hora</option>
                <option value="24h" selected>Últimas 24 horas</option>
                <option value="7d">Última semana</option>
                <option value="30d">Último mes</option>
            </select>
            <button class="btn-refresh">Actualizar datos</button>
        </div>
        {% block content %}{% endblock %}
    </main>


    <!-- Overlay para el sidebar en móvil -->
    <div class="overlay" onclick="toggleSidebar()"></div>

    <script>
    // Inicializar el estado de la barra lateral desde localStorage o por defecto
    if (localStorage.getItem('sidebarHidden') === 'true') {
        document.body.classList.add('sidebar-hidden');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
    }

    function toggleSidebar() {
        document.body.classList.toggle('sidebar-hidden');
        document.body.classList.toggle('sidebar-visible');
        // Guardar el estado en localStorage
        localStorage.setItem('sidebarHidden', document.body.classList.contains('sidebar-hidden'));
    }

    // Evento para cerrar el sidebar al cambiar el tamaño de la ventana
    window.addEventListener('resize', () => {
        if (window.innerWidth <= 768 && !document.body.classList.contains('sidebar-hidden')) {
            document.body.classList.add('sidebar-hidden');
        }
    });

    document.querySelectorAll('.charts-visibility input').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const chartId = this.id.replace('show-', 'chart_');
            const card = document.querySelector(`#${chartId}`).closest('.card');
            card.style.display = this.checked ? 'flex' : 'none';
        });
    });

    document.querySelector('.btn-refresh').addEventListener('click', function() {
        location.reload();
    });

    // Cerrar sidebar al hacer clic en cualquier enlace dentro de él (en móvil)
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                document.body.classList.add('sidebar-hidden');
            }
        });
    });
    </script>
</body>
</html>
