<!DOCTYPE html>
<html>
<head>
  <title>Totales del Sistema</title>
</head>
<body>
  <h1>Datos Totales de la Microrred</h1>
  <table border="1" cellpadding="5">
    <tr>
      <th>Potencia (W)</th>
      <th>Corriente (A)</th>
      <th>Tensión (V)</th>
      <th>Consumo Total (A)</th>
      <th>Fecha</th>
    </tr>
    {% for fila in datos %}
    <tr>
      <td>{{ fila[0] }}</td>
      <td>{{ fila[1] }}</td>
      <td>{{ fila[2] }}</td>
      <td>{{ fila[3] }}</td>
      <td>{{ fila[4] }}</td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('index') }}">Volver</a></p>
</body>
</html>
