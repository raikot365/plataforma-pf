<!DOCTYPE html>
<html>
<head>
  <title>Consumos por Nodo</title>
</head>
<body>
  <h1>Consumos registrados</h1>
  <table border="1" cellpadding="5">
    <tr>
      <th>Nodo</th>
      <th>Consumo (A)</th>
      <th>Prioridad</th>
      <th>Fecha</th>
    </tr>
    {% for fila in datos %}
    <tr>
      <td>{{ fila[0] }}</td>
      <td>{{ fila[1] }}</td>
      <td>{{ fila[2] }}</td>
      <td>{{ fila[3] }}</td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('index') }}">Volver</a></p>
</body>
</html>
